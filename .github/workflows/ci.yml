name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is not optional. Its absence is why CRLF mangling,
        # native path separators and an inert HOME sandbox all shipped
        # undetected: every one of them passes on Linux and macOS.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # commander 15 needs >=22.12, eslint 10 needs ^22.13, so 18 and 20
        # can no longer install the toolchain.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Pack (dry run) — verify the publish payload
        run: npm pack --dry-run

      - name: Hook latency benchmark
        # Runs once per matrix cell so we have numbers on both
        # ubuntu-latest and macos-latest. N=30 keeps each cell under
        # ~15 s. Machine-readable BENCH:<...> lines are picked up by
        # CI annotations.
        run: ./scripts/bench-hook.sh 30
        shell: bash
