name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is not optional. Its absence is why CRLF mangling,
        # native path separators and an inert HOME sandbox all shipped
        # undetected: every one of them passes on Linux and macOS.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # commander 15 needs >=22.12 and eslint 10 needs ^22.13, so 18 and 20
        # can no longer install the toolchain.
        #
        # 22 and 24 are the LTS lines; 26 is current, and it is here because
        # `engines` admits it and nothing was proving it. Node 23 is left out
        # deliberately: better-sqlite3 publishes no prebuild for its ABI
        # (131), so it would need a C++ toolchain. `engines` excludes it for
        # the same reason.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node so `cache: pnpm` can find the
      # store. The pnpm version comes from package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # node_modules is cached, not just the pnpm store.
      #
      # better-sqlite3 12 installs its binary through `prebuild-install`,
      # which downloads from GitHub releases at install time and bypasses
      # the package-manager cache entirely. On macOS runners that download
      # stalls: a measured run spent 422 of its 465 seconds inside `npm ci`
      # (before the move to pnpm) with no
      # output at all, against 30 seconds for every other step combined.
      # Caching the built tree means only a lockfile change pays for it.
      #
      # The key carries the OS and the Node major because the tree contains
      # a compiled native module; restoring an arm64 build onto x64, or a
      # Node 22 ABI onto 24, would be worse than a slow install.
      #
      # Not on Windows: pnpm's node_modules is a tree of junctions into
      # .pnpm, and a restored tree loses them (`EPERM ... realpath`), so
      # packages such as @types/node silently vanish and typecheck fails.
      # Windows installs from the pnpm store cache every run instead.
      - name: Cache node_modules
        id: node-modules-cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm run lint

      - name: Pack (dry run) — verify the publish payload
        run: pnpm pack --dry-run

      - name: Hook latency benchmark
        # Runs once per matrix cell so we have numbers on both
        # ubuntu-latest and macos-latest. N=30 keeps each cell under
        # ~15 s. Machine-readable BENCH:<...> lines are picked up by
        # CI annotations.
        run: ./scripts/bench-hook.sh 30
        shell: bash
